<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>diview — DICOM viewer</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <header id="topbar">
      <div class="brand">diview</div>
      <div id="toolbar"></div>
      <div class="spacer"></div>
      <label for="file-input" class="btn open-top" data-i18n="open.top" data-i18n-title="open.top.title">Open</label>
      <input id="file-input" type="file" multiple webkitdirectory hidden />
    </header>
    <main>
      <aside id="sidebar"><div id="series-list"></div></aside>
      <section id="stage">
        <div id="dropzone">
          <div class="dz-inner">
            <h1 data-i18n="dz.title">Drop DICOM files or a folder</h1>
            <p data-i18n="dz.subtitle">2D X-ray &middot; CT with axial / sagittal / coronal MPR</p>
            <label for="file-input" class="btn dz-open" data-i18n="open.dz" data-i18n-title="open.dz.title">Open…</label>
          </div>
        </div>
        <div id="layout-2d" class="layout hidden">
          <div class="viewport" data-vp="stack"></div>
        </div>
        <div id="layout-mpr" class="layout hidden">
          <div class="viewport" data-vp="axial"><span class="vp-label">AXIAL</span></div>
          <div class="viewport" data-vp="sagittal"><span class="vp-label">SAGITTAL</span></div>
          <div class="viewport" data-vp="coronal"><span class="vp-label">CORONAL</span></div>
        </div>
      </section>
    </main>
